<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="梵文经书">
  <!-- 和 eden-tan.com 的图标同一家族:深底圆角方块 + 白色粗线,一处 Mint。
       画的是天城体的顶线(shirorekha):每个梵文字都挂在一条横线下。
       三根竖笔长短不一,中间最长的那根是 Mint。
       改这里要重跑 scripts/icons.mjs 生成 PNG 与 ICO。 -->
  <rect width="32" height="32" rx="8" fill="#1c1917"/>
  <g fill="#fafaf9">
    <rect x="6" y="8" width="20" height="3.2" rx="1.3"/>
    <rect x="8.6" y="8" width="3.2" height="9.5" rx="1.3"/>
    <rect x="20.2" y="8" width="3.2" height="12.5" rx="1.3"/>
  </g>
  <rect x="14.4" y="8" width="3.2" height="16" rx="1.3" fill="#7bdcb5"/>
</svg>
